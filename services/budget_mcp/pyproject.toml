[project]
name = "homefund-budget-mcp"
version = "0.1.0"
description = "Home Fund budget-mcp: cash flow, savings projection and cut solver over FastMCP"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastmcp>=2.12,<3",
    "homefund-contracts",
    "homefund-db",
    "hypothesis>=6.100",
]

[project.optional-dependencies]
test = []

[project.scripts]
homefund-budget-mcp = "homefund_budget_mcp.server:main"

[tool.uv.sources]
homefund-contracts = { workspace = true }
homefund-db = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"
