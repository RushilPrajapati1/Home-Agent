[project]
name = "homefund-embed"
version = "0.1.0"
description = "Home Fund embed service: BGE-M3 dense + sparse embeddings and bge-reranker-v2-m3 over HTTP"
requires-python = ">=3.12,<3.13"
# The base install is the HTTP client and wire models only, so ingest and guides-mcp can
# depend on it without pulling torch. The server's model stack is the `model` extra.
dependencies = [
    "homefund-contracts",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28",
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
model = [
    "FlagEmbedding>=1.3.4,<2",
    "torch>=2.4",
]

[project.scripts]
homefund-embed = "homefund_embed.app:main"

[tool.uv.sources]
homefund-contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"
